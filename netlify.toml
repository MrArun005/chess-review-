# Netlify config. The engine runs single-threaded, so no cross-origin isolation
# headers are needed — and omitting them keeps third-party connections (the
# online-play signalling/relay) unencumbered.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
