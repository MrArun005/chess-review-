# Netlify config. Cross-origin isolation is required for multi-threaded
# Stockfish (SharedArrayBuffer). Without these headers you fall back to the
# single-threaded engine build — 3-4x slower.
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
